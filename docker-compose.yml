version: "3.9"

services:
  noogler:
    build:
      context: .
      dockerfile: Dockerfile
    image: noogler-nosana:local
    container_name: noogler-nosana
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
